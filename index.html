<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Abishek S, AI Engineer building production LLM systems, agentic tools and full-stack applications." />
    <title>Abishek S · AI Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@700&family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Hide the page until the swarm takes over (no flash of the finished page). If the build
      // can't start, show everything after a few seconds anyway.
      if (!/[?&]swarm=off/.test(location.search) && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('sw-pre')
        // every load (refresh included) builds from the top: don't restore the old scroll spot
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
        if (location.hash) history.replaceState(null, '', location.pathname + location.search)
        setTimeout(function () { if (!window.__swarmStarted) document.documentElement.classList.remove('sw-pre') }, 4000)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
