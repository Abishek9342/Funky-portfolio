<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Abishek S · AI Engineer</title>
    <meta name="description" content="Abishek S, AI engineer: production LLM platforms, agentic tools and full-stack applications, presented as a real-time rendered world." />
    <meta name="theme-color" content="#b4bcc5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/syncopate-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" as="image" href="/poster-desktop.webp" media="(min-width: 761px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/poster-phone.webp" media="(max-width: 760px)" fetchpriority="high" />
    <style>
      /* critical: the poster paints before any JS */
      html, body { margin: 0; background: #b4bcc5; }
      .poster { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #b4bcc5; }
      .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
    </style>
  </head>
  <body>
    <div class="poster" id="poster" aria-hidden="true">
      <picture>
        <source media="(max-width: 760px)" srcset="/poster-phone.webp" />
        <img src="/poster-desktop.webp" alt="" fetchpriority="high" decoding="async" />
      </picture>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
